name: Suggest an improvement
description: Describe a study or card-making task that could be easier.
body:
  - type: textarea
    id: task
    attributes:
      label: What are you trying to do?
      description: Describe the task and the part that gets in your way. Please avoid private study content.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Your suggestion
      description: What would make that task easier?
