name: Verify Atelier candidate
on:
  push:
    branches: ['atelier-*', main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atelier-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: ${{ github.workspace }}/test_support
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Original engines, current contracts and browser workflows
        run: python verify_release.py
      - name: Keep evidence even when a gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atelier-verification-${{ github.sha }}
          path: |
            verification/
            screenshots/
            output/playwright/
          retention-days: 14
# Verification only: no Pages deployment, release publication or AnkiWeb upload.
